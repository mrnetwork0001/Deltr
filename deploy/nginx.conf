# Deltr public showcase - reverse proxy in front of the FastAPI process on 127.0.0.1:8000.
# Install as /etc/nginx/sites-available/deltr and symlink into sites-enabled.
# For TLS run: certbot --nginx -d YOUR_DOMAIN   (after pointing DNS at the VPS)

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # dashboard, landing page, REST API, MCP endpoint
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # the 1 Hz snapshot stream
    location /ws/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # MCP streamable HTTP keeps long-lived responses open
    location /mcp {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }
}
